<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FFFBF5" />
    <meta name="description" content="Astro Blog Studio — 浏览器里的博客 Markdown 工作台" />
    <script>
      // 在首帧前应用主题，避免刷新时先亮后暗；逻辑与 src/components/theme-provider.tsx 保持一致。
      (() => {
        let preference = 'system';
        try {
          const raw = window.localStorage.getItem('abs.settings.v1');
          if (raw) {
            const stored = JSON.parse(raw);
            const theme = stored?.state?.appearance?.theme;
            if (theme === 'system' || theme === 'day' || theme === 'night') preference = theme;
          }
        } catch {
          // localStorage 不可用时按系统偏好处理
        }
        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        const resolved = preference === 'night' ? 'night' : preference === 'day' ? 'day' : prefersDark ? 'night' : 'day';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved === 'night' ? 'dark' : 'light';
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', resolved === 'night' ? '#100B0E' : '#FFFBF5');
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23C93F6D'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle' fill='%23FFFBF5'%3E%E6%A8%B1%3C/text%3E%3C/svg%3E"
    />
    <!-- 安装到桌面 / 主屏：manifest 由 vite-plugin-pwa 在构建时注入，这里只补 iOS 需要的元信息。 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Studio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Astro Blog Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
