<style>
/* ========== 01 樱糖手帐 · 夜间模式试验 ==========
   这一页只做一件事：在同一张工作台上，把「夜」摆出来给人看。
   页面本身是深色展台；被看的 mock 有两套 token：data-theme="night" / "day"。
   token 名沿用 src/styles/app.css 的 --abs-*，方便直接映射回实现。 */

/* ---------- fonts (inlined by scripts/build-night-mode.mjs) ---------- */
@font-face {
  font-family: "Baloo 2 Variable";
  font-style: normal;
  font-weight: 400 800;
  font-display: swap;
  src: url(__FONT_BALOO__) format("woff2");
}
@font-face {
  font-family: "Sometype Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(__FONT_MONO_400__) format("woff2");
}
@font-face {
  font-family: "Sometype Mono";
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url(__FONT_MONO_500__) format("woff2");
}

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
h1, h2, h3, h4, p, figure, blockquote, dl, dd, pre { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
ul, ol { margin: 0; padding: 0; list-style: none; }
svg { display: block; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------- board chrome（深色展台，不抢 mock） ---------- */
:root {
  --board-bg: #100d10;
  --board-panel: #181418;
  --board-ink: #f0e6df;
  --board-muted: #a09298;
  --board-dim: #7e7177;
  --board-line: #332a2f;
  --board-line-soft: #241f23;
  --board-rose: #f087a8;
  --board-rose-ink: #241016;
  --board-mint: #8fdcc4;
  --board-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --board-mono: "Sometype Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --board-display: "Baloo 2 Variable", "Zen Maru Gothic", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --board-ease: cubic-bezier(0.34, 1.4, 0.64, 1);
}
html { min-width: 320px; background: var(--board-bg); }
body {
  min-height: 100vh;
  background: var(--board-bg);
  color: var(--board-ink);
  font-family: var(--board-font);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: rgba(240, 135, 168, 0.32); color: var(--board-ink); }
:focus-visible { outline: 2px solid var(--board-rose); outline-offset: 2px; }
a { text-underline-offset: 3px; }

.board-top {
  position: sticky;
  top: 0;
  z-index: 80;
  background: var(--board-bg);
  border-bottom: 1px solid var(--board-line);
}
.board-inner {
  max-width: 1600px;
  margin: 0 auto;
  padding: 13px 24px 0;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.board-brand { display: flex; align-items: center; gap: 11px; min-width: 252px; }
.board-mark {
  width: 36px;
  height: 36px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--board-rose);
  border: 1.5px solid #2a161d;
  color: var(--board-rose-ink);
  font-family: var(--board-display);
  font-size: 16px;
  font-weight: 800;
  line-height: 1;
  box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.55);
  transform: rotate(-2deg);
}
.board-brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.board-title {
  margin: 0;
  font-family: var(--board-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--board-ink);
}
.board-sub { font-size: 10.5px; color: var(--board-muted); letter-spacing: 0.02em; }
.board-tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border: 1px solid var(--board-line);
  border-radius: 999px;
  background: var(--board-panel);
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.board-tabs::-webkit-scrollbar { display: none; }
.board-tab {
  height: 30px;
  padding: 0 13px;
  border-radius: 999px;
  color: var(--board-muted);
  font-size: 12px;
  white-space: nowrap;
  transition: color 160ms, background 160ms;
}
.board-tab:hover { color: var(--board-ink); }
.board-tab.is-active { background: var(--board-ink); color: #141014; font-weight: 600; }
.board-switch {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10.5px;
  color: var(--board-muted);
  white-space: nowrap;
}
.board-switch .seg {
  display: flex;
  padding: 3px;
  border: 1px solid var(--board-line);
  border-radius: 999px;
  background: var(--board-panel);
}
.board-switch .seg button {
  height: 26px;
  min-width: 42px;
  border-radius: 999px;
  color: var(--board-muted);
  font-size: 11.5px;
  transition: color 160ms, background 160ms;
}
.board-switch .seg button:hover { color: var(--board-ink); }
.board-switch .seg button.is-on { background: var(--board-rose); color: var(--board-rose-ink); font-weight: 700; }
.board-switch .lamp {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--board-rose);
  box-shadow: 0 0 0 3px rgba(240, 135, 168, 0.14);
  flex: none;
}
.board-note {
  max-width: 1600px;
  margin: 0 auto;
  padding: 8px 24px 12px;
  font-size: 11px;
  line-height: 1.7;
  color: #8b7e84;
  letter-spacing: 0.01em;
}
.board-note b { color: var(--board-ink); font-weight: 600; }
.board-note a { color: var(--board-rose); border-bottom: 1px dotted rgba(240, 135, 168, 0.5); }
.board-main { max-width: 1600px; margin: 0 auto; padding: 2px 24px 64px; }

.view { display: none; }
.view.is-active { display: block; }
.view-cap {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 18px;
  flex-wrap: wrap;
  padding: 14px 2px 10px;
}
.view-cap-title { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: var(--board-ink); }
.view-cap-note { font-size: 11.5px; color: var(--board-muted); }
.view-cap-meta {
  font-family: var(--board-mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--board-dim);
  white-space: nowrap;
}
.stage {
  border: 1px solid var(--board-line);
  border-radius: 20px;
  overflow: auto;
  background: #0c0a0c;
  overscroll-behavior-x: contain;
}
.board-toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  z-index: 120;
  transform: translate(-50%, 12px);
  display: inline-flex;
  align-items: center;
  gap: 9px;
  max-width: calc(100vw - 32px);
  padding: 10px 16px;
  border: 1px solid var(--board-line);
  border-radius: 999px;
  background: #1b161a;
  color: var(--board-ink);
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  box-shadow: 5px 6px 0 rgba(0, 0, 0, 0.55);
  transition: opacity 180ms, transform 180ms var(--board-ease);
}
.board-toast::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--board-mint); flex: none; }
.board-toast.is-on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1000px) {
  .board-inner { padding: 11px 14px 0; gap: 10px; }
  .board-brand { min-width: 0; flex: 1 1 auto; }
  .board-tabs { order: 3; width: 100%; flex-wrap: wrap; border-radius: 16px; padding: 5px; }
  .board-tab { padding: 0 11px; font-size: 11.5px; }
  .board-switch { margin-left: auto; }
  .board-note { padding: 8px 14px 10px; }
  .board-main { padding: 0 12px 48px; }
  .stage { border-radius: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ========== mock：两套 token ==========
   与实现同名的 --abs-* 变量，只换值、不换名字。 */

  --abs-font-mono: "Sometype Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  position: relative;
  isolation: isolate;
  min-width: 1180px;
  border-radius: 18px;
  overflow: hidden;
  background-color: var(--abs-desk);
  background-image: radial-gradient(circle at 1px 1px, var(--abs-desk-dot) 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--abs-ink);
  font-family: var(--abs-font-body);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;

.mock :focus-visible { outline: 2px solid var(--abs-focus); outline-offset: 2px; border-radius: 4px; }
.mock { scrollbar-color: var(--abs-line) transparent; }
.mock ::-webkit-scrollbar { width: 10px; height: 10px; }
.mock ::-webkit-scrollbar-track { background: transparent; }
.mock ::-webkit-scrollbar-thumb { background: var(--abs-line); border-radius: 99px; border: 3px solid var(--abs-paper); }

/* v2 评审修订：夜间局部去饱和，避免亮粉在暗底上发光。
   索引卡图标换成卡片式，夜间直接用白色；昼模式保留樱粉/墨色。 */
.mock[data-theme="night"] .m-tree-ico { color: #ffffff; }
.mock[data-theme="night"] .m-tree-ico-file { color: rgba(255, 255, 255, 0.78); }
.mock[data-theme="night"] .m-tree-caret { color: rgba(255, 255, 255, 0.45); }
.mock[data-theme="night"] .m-badge-blush { color: var(--abs-ink); }
.mock[data-theme="night"] .tok-mark { color: #d99aae; }
.mock[data-theme="night"] .tok-code { color: #a9c9bb; }
.mock[data-theme="night"] .m-stamp { border-color: var(--abs-stamp); color: var(--abs-stamp); }

/* ========== mock base components ========== */
.m-shell {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 100%;
  padding: 12px clamp(12px, 1.5vw, 22px) 16px;
}
.m-topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 9px 12px;
  border: 1.5px solid var(--abs-edge);
  border-radius: 16px;
  background: var(--abs-paper);
  box-shadow: var(--abs-shadow-sm);
}
.m-brand { display: flex; align-items: center; gap: 9px; flex: 1 1 240px; min-width: 0; }
.m-seal {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: none;
  border-radius: 10px;
  border: 1.5px solid var(--abs-accent-edge);
  background: var(--abs-sakura);
  color: var(--abs-on-accent);
  font-family: var(--abs-font-display);
  font-size: 16px;
  font-weight: 800;
  line-height: 1;
}
.m-brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.m-brand-text strong { font-family: var(--abs-font-display); font-size: 13px; font-weight: 700; letter-spacing: 0.01em; }
.m-brand-text span {
  font-family: var(--abs-font-mono);
  font-size: 9px;
  color: var(--abs-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.m-top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.m-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 13px;
  border: 1.5px solid var(--abs-edge);
  border-radius: 999px;
  background: var(--abs-paper);
  color: var(--abs-ink);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 2px 2px 0 var(--abs-btn-shadow);
  transition: transform 180ms var(--abs-ease-spring), box-shadow 180ms, background 180ms, border-color 180ms;
}
.m-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--abs-btn-shadow-hover); }
.m-btn:active { transform: translate(1px, 1px); box-shadow: none; }
.m-btn-primary { background: var(--abs-sakura); border-color: var(--abs-accent-edge); color: var(--abs-on-accent); }
.m-btn-primary:hover { background: var(--abs-sakura-deep); }
.m-btn-ghost { border-style: dashed; background: transparent; box-shadow: none; color: var(--abs-ink-soft); font-weight: 600; }
.m-btn-ghost:hover { background: var(--abs-paper-2); transform: none; box-shadow: none; }
.m-btn-danger { border-color: var(--abs-danger); color: var(--abs-danger); background: var(--abs-paper); box-shadow: none; font-weight: 600; }
.m-btn-danger:hover { background: var(--abs-danger-tint); transform: none; box-shadow: none; }
.m-btn-sm { height: 30px; padding: 0 10px; font-size: 11px; }
.m-icon-btn {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  flex: none;
  border: 1.5px solid var(--abs-line);
  border-radius: 9px;
  background: var(--abs-paper);
  color: var(--abs-ink-soft);
  transition: border-color 160ms, color 160ms, background 160ms;
}
